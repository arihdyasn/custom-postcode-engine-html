<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Postal Code Engine</title>
    <style>
        /* CSS Custom Properties for Dynamic Theming */
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #3b82f6;
            --panel-bg: #1e1e1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Top Bar & Hamburger Menu Button */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            width: 30px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-btn span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: var(--text-color);
            border-radius: 2px;
        }

        /* Central Code Display Interface */
        .main-display {
            text-align: center;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
        }

        .postal-code {
            font-size: clamp(3.5rem, 10vw, 6rem);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
        }

        .fine-print {
            font-size: 0.95rem;
            opacity: 0.65;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .anchor-print {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-top: 0.5rem;
        }

        /* Sliding Navigation Drawer Menu */
        .sidebar {
            position: absolute;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100%;
            background-color: var(--panel-bg);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 20;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
            margin-bottom: 0.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Interactive Menu Controls Component */
        .menu-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .menu-item label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .menu-item input[type="text"],
        .menu-item select {
            width: 100%;
            padding: 0.75rem;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
        }

        .menu-item select option {
            background-color: #1e1e1e;
        }

        .color-pickers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .color-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
        }

        .color-box input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        /* Interface Overlay Mask */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            z-index: 15;
            display: none;
        }

        .overlay.visible {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Overlay Mask -->
    <div class="overlay" id="menuOverlay"></div>

    <!-- Top Navigation Ribbon -->
    <div class="top-bar">
        <button class="menu-btn" id="toggleMenuBtn" aria-label="Open Personalisation Settings">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <!-- Main Live Code Output Viewport -->
    <div class="main-display">
        <div class="postal-code" id="codeDisplay" title="Click to copy location string">--- ---</div>
        <div class="fine-print" id="metricsDisplay">Awaiting GPS Location Feed...</div>
        <div class="anchor-print" id="anchorDisplay">NO ANCHOR SET</div>
    </div>

    <!-- Settings Sidebar Panel -->
    <div class="sidebar" id="settingsSidebar">
        <div class="sidebar-header">
            <h3>Personalisation</h3>
            <button class="close-btn" id="closeMenuBtn">&times;</button>
        </div>

        <!-- 1. Anchor Location Configuration -->
        <div class="menu-item">
            <label for="anchorInput">Anchor Location</label>
            <input type="text" id="anchorInput" value="COLCHESTER" placeholder="e.g. CO1 1AA, LN1 1AA, BRISTOL">
        </div>

        <!-- 2. System Logic Selection Rule Toggle -->
        <div class="menu-item">
            <label for="styleSelect">Code Style</label>
            <select id="styleSelect">
                <option value="2">Unified Unidistrict</option>
                <option value="1" selected>London-Style Districts</option>
            </select>
        </div>

        <!-- 3. Engine Update Loop Timer Control Frequency -->
        <div class="menu-item">
            <label for="frequencySelect">Update Frequency</label>
            <select id="frequencySelect">
                <option value=1000>Every Second</option>
                <option value="5000">Every 5 Seconds</option>
                <option value="10000" selected>Every 10 Seconds</option>
                <option value="30000">Every 30 Seconds</option>
                <option value="60000">Every 1 Minute</option>
            </select>
        </div>

        <!-- 4. Dynamic Theme Configuration Layout Color Interface Palette -->
        <div class="menu-item">
            <label>Colours</label>
            <div class="color-pickers">
                <div class="color-box">
                    <input type="color" id="bgColorPicker" value="#121212">
                    <span>Canvas</span>
                </div>
                <div class="color-box">
                    <input type="color" id="textColorPicker" value="#ffffff">
                    <span>Text</span>
                </div>
                <div class="color-box">
                    <input type="color" id="accentColorPicker" value="#3b82f6">
                    <span>Accent</span>
                </div>
            </div>
        </div>
    </div>

    <!-- System Calculation Engine Scripts -->
    <script>
        // System Data Registry: Master Anchor Dictionary Mapping Strings to Absolute Core Grids
        const anchorDictionary = {
            "COLCHESTER":  { alpha: "CO", lat: 51.890906, lon: 0.900864 },
            "CO1 1AA":     { alpha: "CO", lat: 51.890906, lon: 0.900864 },
            "LINCOLN":     { alpha: "LN", lat: 53.229482, lon: -0.541680 },
            "LN1 1AA":     { alpha: "LN", lat: 53.229482, lon: -0.541680 },
            "ALFORD":      { alpha: "LN", lat: 53.260173, lon: 0.172769 },
            "LN13 0AA":    { alpha: "LN", lat: 53.260173, lon: 0.172769 },
            "CHELMSFORD":  { alpha: "CM", lat: 51.737220, lon: 0.476016 },
            "CM1 1AA":     { alpha: "CM", lat: 51.737220, lon: 0.476016 }, 
            "BRISTOL":     { alpha: "BS", lat: 51.449515, lon: -2.578372 },
            "BS1 1AA":     { alpha: "BS", lat: 51.449515, lon: -2.578372 },
            "NOTTINGHAM":  { alpha: "NG", lat: 52.955073, lon: -1.141027 },
            "NG1 1AA":     { alpha: "NG", lat: 52.955073, lon: -1.141027 },
            "IPSWICH":     { alpha: "IP", lat: 52.052652, lon: 1.146613 },
            "IP1 1AA":     { alpha: "IP", lat: 52.052652, lon: 1.146613 },
            "PETERBOROUGH":{ alpha: "PE", lat: 52.572500, lon: -0.242700 },
            "PE1 1AA":     { alpha: "PE", lat: 52.572500, lon: -0.242700 }
        };

        // Static System Alphabet Lookups
        const centrals = ["EC", "WC"];
        const centralscentres = [90, 270];
        const cardinals = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
        const cardinalscentres = [0, 45, 90, 135, 180, 225, 270, 315];

        const outward_ex = ["A", "B", "C", "D", "E", "F", "G", "H", "J", "K", "M", "N", "P", "R", "S", "T", "U", "V", "W", "X", "Y"];
        const inward_first = ["A", "B", "D", "E", "F", "G", "H", "J", "L", "N", "P", "Q", "R", "S", "T", "U", "W", "X", "Y", "Z"];
        const inward_subtractive = ["A", "D", "F", "H", "L", "P", "R", "T", "W", "Y"];
        const inward_additive = ["B", "E", "G", "J", "N", "Q", "S", "U", "X", "Z"];

        // State Machine Scope Handling Variables
        let userLocation = null;
        let updateIntervalId = null;
        let activeAnchor = anchorDictionary["COLCHESTER"];
        let activeAnchorName = "COLCHESTER";

        // UI Element Query Selectors
        const menuBtn = document.getElementById('toggleMenuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const sidebar = document.getElementById('settingsSidebar');
        const overlay = document.getElementById('menuOverlay');
        const anchorInput = document.getElementById('anchorInput');
        const styleSelect = document.getElementById('styleSelect');
        const frequencySelect = document.getElementById('frequencySelect');
        const codeDisplay = document.getElementById('codeDisplay');
        const metricsDisplay = document.getElementById('metricsDisplay');
        const anchorDisplay = document.getElementById('anchorDisplay');

        // Theme Pickers
        const bgColorPicker = document.getElementById('bgColorPicker');
        const textColorPicker = document.getElementById('textColorPicker');
        const accentColorPicker = document.getElementById('accentColorPicker');

        // --- Interface Animation Event Handles ---
        function toggleMenu() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // --- Theme Engine Listeners ---
        function updateColors() {
            document.documentElement.style.setProperty('--bg-color', bgColorPicker.value);
            document.documentElement.style.setProperty('--text-color', textColorPicker.value);
            document.documentElement.style.setProperty('--accent-color', accentColorPicker.value);
            
            // Generate secondary contrast overlay shading background configurations matching custom themes
            const panelHex = bgColorPicker.value;
            const r = parseInt(panelHex.slice(1,3), 16), g = parseInt(panelHex.slice(3,5), 16), b = parseInt(panelHex.slice(5,7), 16);
            const mixR = Math.min(255, Math.floor(r + 15)), mixG = Math.min(255, Math.floor(g + 15)), mixB = Math.min(255, Math.floor(b + 15));
            const newPanelHex = "#" + ((1 << 24) + (mixR << 16) + (mixG << 8) + mixB).toString(16).slice(1);
            document.documentElement.style.setProperty('--panel-bg', newPanelHex);
        }

        [bgColorPicker, textColorPicker, accentColorPicker].forEach(p => p.addEventListener('input', updateColors));

        // --- Core Geodesic Mathematical Conversions Engine (Movable Type Scripts Architecture) ---
        function calculateMetrics(lat1, lon1, lat2, lon2) {
            const R = 3958.8; // Earth Mean Radius in Miles
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            // Haversine Distance Equation
            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = R * c;

            // Spherical Initial Bearing Calculation Vector
            const y = Math.sin(deltaLambda) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
            let bearing = Math.atan2(y, x) * 180 / Math.PI;
            bearing = (bearing + 360) % 360; // Normalise bearing scope to absolute 0 - 360

            return { distance, bearing };
        }

        // --- Base Spatial Angle Suffix Mapping Resolvers ---
        function getAngleCode(angle, centre, width) {
            const dev = angle - centre;
            if (dev < 0) {
                const calc = (20 / width) * (centre - angle);
                const fDet = Math.min(Math.floor(calc), 19);
                const sDet = Math.min(Math.floor(10 * (calc - Math.floor(calc))), 9);
                return inward_first[fDet] + inward_subtractive[sDet];
            } else {
                let calc = (20 / width) * dev;
                if (calc > 20) {
                    const wrapCentre = 360;
                    calc = (20 / width) * (wrapCentre - angle);
                    const fDet = Math.min(Math.floor(calc), 19);
                    const sDet = Math.min(Math.floor(10 * (calc - Math.floor(calc))), 9);
                    return inward_first[fDet] + inward_subtractive[sDet];
                } else {
                    const fDet = Math.min(Math.floor(calc), 19);
                    const sDet = Math.min(Math.floor(10 * (calc - Math.floor(calc))), 9);
                    return inward_first[fDet] + inward_additive[sDet];
                }
            }
        }

        function sectorSearch(angle, directions, centres, width) {
            for (let i = 0; i < directions.length; i++) {
                if (centres[i] - (width / 2) <= angle && angle < centres[i] + (width / 2)) return i;
                if (centres[i] - (width / 2) <= (angle - 360) && (angle - 360) < centres[i] + (width / 2)) return i;
            }
            return 0;
        }

        // --- Core Strategic Grid Parser Core ---
        function runCoordinateCodeEngine() {
            if (!userLocation) return;

            const { distance, bearing } = calculateMetrics(activeAnchor.lat, activeAnchor.lon, userLocation.lat, userLocation.lon);
            const systemStyle = styleSelect.value;
            let code = "";

            // SYSTEM 1: ORIGINAL LONDON-STYLE BOUNDARIES
            if (systemStyle === "1") {
                if (distance < 1) {
                    const idx = sectorSearch(bearing, centrals, centralscentres, 180);
                    code += centrals[idx];
                    
                    const num1 = Math.floor(distance / 0.25) + 1;
                    const letterDet = 84 * (distance - (num1 - 1) * 0.25);
                    const letter = outward_ex[Math.min(Math.floor(letterDet), 20)];
                    const num2 = Math.floor(10 * (letterDet - Math.floor(letterDet)));
                    
                    code += `${num1}${letter} ${num2}`;
                    code += getAngleCode(bearing, centralscentres[idx], 90);
                } else {
                    const idx = sectorSearch(bearing, cardinals, cardinalscentres, 45);
                    code += cardinals[idx];
                    
                    if (distance < 2) {
                        const letterDet = 21 * (distance - 1);
                        const letter = outward_ex[Math.min(Math.floor(letterDet), 20)];
                        const num2 = Math.floor(10 * (letterDet - Math.floor(letterDet)));
                        code += `1${letter} ${num2}`;
                    } else {
                        code += `${Math.floor(distance)} ${Math.floor(10 * (distance - Math.floor(distance)))}`;
                    }
                    code += getAngleCode(bearing, cardinalscentres[idx], 22.5);
                }
            } 
            // SYSTEM 2: COMPREHENSIVE UNIFIED UNIDISTRICT
            else if (systemStyle === "2") {
                const prefix = activeAnchor.alpha;
                if (distance < 1) {
                    let ringIdx = Math.floor(distance / (1.0 / 21));
                    ringIdx = Math.min(Math.max(0, ringIdx), 20); // Force-clamp layout index values safety boundaries
                    const letter = outward_ex[ringIdx];
                    
                    const remainder = (distance / (1.0 / 21)) - ringIdx;
                    const num2 = Math.floor(10 * remainder);
                    
                    code += `${prefix}1${letter} ${num2}`;
                } else {
                    const num1 = Math.floor(distance);
                    const num2 = Math.floor(10 * (distance - num1));
                    code += `${prefix}${num1} ${num2}`;
                }
                code += getAngleCode(bearing, 180, 180);
            }

            // Interface Updates Output Rendering Stack
            codeDisplay.textContent = code;
            metricsDisplay.textContent = `${distance.toFixed(4)} MILES  /  ${bearing.toFixed(2)}° BEARING`;
            anchorDisplay.textContent = activeAnchorName;
        }

        // --- Anchor Config Resolution Engine Handles ---
        function parseAnchorInput() {
            const rawVal = anchorInput.value.trim().toUpperCase();
            if (!rawVal) return;

            // 1. Text lookup comparison step
            if (anchorDictionary[rawVal]) {
                activeAnchor = anchorDictionary[rawVal];
                activeAnchorName = rawVal; 
                runCoordinateCodeEngine();
                return;
            }

            // 2. Latitude, Longitude parse structural configuration verification fallback step
            const coords = rawVal.split(',');
            if (coords.length === 2) {
                const parsedLat = parseFloat(coords[0]);
                const parsedLon = parseFloat(coords[1]);
                if (!isNaN(parsedLat) && !isNaN(parsedLon)) {
                    activeAnchor = { alpha: "XX", lat: parsedLat, lon: parsedLon };
                    activeAnchorName = "CUSTOM GRID COORDS";
                    runCoordinateCodeEngine();
                }
            }
        }

        anchorInput.addEventListener('change', parseAnchorInput);
        styleSelect.addEventListener('change', runCoordinateCodeEngine);

        // --- Time Controller Re-Loop Triggering States Engine Handles ---
        function setupUpdateTimer() {
            if (updateIntervalId) clearInterval(updateIntervalId);
            const freq = parseInt(frequencySelect.value);
            updateIntervalId = setInterval(runCoordinateCodeEngine, freq);
        }

        frequencySelect.addEventListener('change', setupUpdateTimer);

        // --- Native Hardware HTML5 GPS Location Streaming Tracking Handles ---
        function initGeolocationTracking() {
            if (!navigator.geolocation) {
                metricsDisplay.textContent = "GPS Hardware Unresponsive / Unsupported By Device Browser";
                return;
            }

            navigator.geolocation.watchPosition(
                (pos) => {
                    userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                    // Force a rapid computational run upon hardware update detection ticks
                    runCoordinateCodeEngine();
                },
                (err) => {
                    console.error("GPS Tracking Access Intercepted / Terminated", err);
                    metricsDisplay.textContent = "GPS Permission Error: Access Denied";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // --- Clipboard Interactivity Handles ---
        codeDisplay.addEventListener('click', () => {
            if (codeDisplay.textContent === "--- ---") return;
            navigator.clipboard.writeText(codeDisplay.textContent).then(() => {
                const originalText = codeDisplay.textContent;
                codeDisplay.textContent = "COPIED!";
                setTimeout(() => { codeDisplay.textContent = originalText; }, 1200);
            });
        });

        // Initialize App State Elements Upon Evaluation Pass
        parseAnchorInput();
        setupUpdateTimer();
        initGeolocationTracking();
    </script>
</body>
</html>
